name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Tools
        run: brew install xcodegen ffmpeg

      - name: Build for simulator
        run: |
          xcodegen generate
          FAILED=0
          xcodebuild -project Bombocut.xcodeproj -target Bombocut -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || FAILED=1
          if [ "$FAILED" = 1 ]; then
            echo "::error title=Simulator build::$(grep -E ': error:' build.log | sed "s#$PWD/##" | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Demo clips
        run: |
          mkdir -p demo
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1080x1920:rate=30:duration=6" -f lavfi -i "sine=frequency=330:duration=6" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest demo/demo1.mp4
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1080x1920:rate=30:duration=4,hue=h=120" -f lavfi -i "sine=frequency=440:duration=4" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest demo/demo2.mp4
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1920x1080:rate=30:duration=5,hue=h=240" -f lavfi -i "sine=frequency=550:duration=5" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest demo/demo3.mp4

      - name: Take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          echo "::notice::Simulator: $(xcrun simctl list devices | grep $UDID | head -1)"
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl status_bar $UDID override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install $UDID build/Debug-iphonesimulator/Bombocut.app
          DATA=$(xcrun simctl get_app_container $UDID cz.krechler.bombocut data)
          mkdir -p "$DATA/Documents/Media"
          cp demo/*.mp4 "$DATA/Documents/Media/"
          mkdir -p shots
          for m in home setup editor selected trim speed look adjust captions captionstyle captionsframe fullscreen canvas export done; do
            xcrun simctl launch $UDID cz.krechler.bombocut -demo $m
            sleep 10
            xcrun simctl io $UDID screenshot shots/$m.png
            xcrun simctl terminate $UDID cz.krechler.bombocut || true
            sleep 1
          done
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 78 -Z 1400 "$f" --out "${f%.png}.jpg" >/dev/null; rm "$f"; done
          ls -la shots

      - name: Publish to screens branch
        run: |
          cp -R shots "$RUNNER_TEMP/shots"
          git config user.name "bombocut-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan screens
          git rm -rfq .
          git clean -fdxq
          cp -R "$RUNNER_TEMP/shots" shots
          git add shots
          git commit -qm "Screenshots of $GITHUB_SHA"
          git push -fq origin screens
