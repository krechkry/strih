name: Freeze hunt (iOS 26)

# Runs the app on an iOS 26 simulator with a project open (Home and the editor) and samples the main
# thread, to find the iOS 26 freeze from 1.1 (a render loop: see strih/next-chat-ios26-freeze.md).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/freeze-hunt.yml']

jobs:
  hunt:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Tools
        run: brew install xcodegen ffmpeg

      - name: Build for the simulator
        run: |
          xcodegen generate
          # Release like the App Store build, plus STORESHOTS so -demo can make the project
          xcodebuild build -project Bombocut.xcodeproj -scheme Bombocut -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath dd ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=STORESHOTS \
            > build.log 2>&1 || (tail -40 build.log; exit 1)

      - name: Run and sample
        run: |
          set -x
          APP=$(ls -d dd/Build/Products/Release-iphonesimulator/Bombocut.app)
          mkdir -p out
          # an iPhone on the newest iOS 26 runtime (an iOS 18 one too, for comparison)
          # every iPhone on the newest iOS 26 runtime: a layout loop can depend on the exact screen size
          xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ks=sorted(k for k in d if 'iOS-26' in k)
          for x in (d[ks[-1]] if ks else []):
              if x['name'].startswith('iPhone'): print(x['udid'] + '|' + x['name'])" > devices.txt
          cat devices.txt
          while IFS='|' read -r UDID NAME; do
            TAG=$(echo "$NAME" | tr ' ' '_')
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            DATA=$(xcrun simctl get_app_container "$UDID" cz.krechler.bombocut data)
            mkdir -p "$DATA/Documents/Media"
            for i in 1 2 3; do
              ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30:d=30" -f lavfi -i "sine=frequency=$((300*i)):duration=30" \
                -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$DATA/Documents/Media/demo$i.mp4"
            done
            for MODE in home real edit; do
              OUT="out/$TAG-$MODE"
              if [ "$MODE" = real ]; then
                LINE=$(xcrun simctl launch "$UDID" cz.krechler.bombocut -onboarded YES -icloudAsked YES)
              else
                LINE=$(xcrun simctl launch "$UDID" cz.krechler.bombocut -demo "$MODE")
              fi
              PID=${LINE##*: }
              sleep 20
              xcrun simctl io "$UDID" screenshot "$OUT.png" || true
              CPU=$(ps -o %cpu= -p "$PID" | tr -d ' ')
              sample "$PID" 3 -file "$OUT-sample.txt" >/dev/null 2>&1 || true
              # only the main thread's part of the call graph, our own frames
              MAIN=$(awk '/Thread_[0-9]+.*com\.apple\.main-thread/{f=1;print;next} f&&/^ {4}[0-9]+ Thread_/{exit} f{print}' "$OUT-sample.txt" \
                | grep -E "\(in (Bombocut|SwiftUI|SwiftUICore)\)" | head -40 \
                | sed -E 's/^[ +!:|]*//' | cut -c1-150 | awk '{printf "%s%%0A", $0}')
              echo "::notice title=$NAME $MODE (cpu $CPU %)::$MAIN"
              xcrun simctl terminate "$UDID" cz.krechler.bombocut || true
              sleep 2
            done
            xcrun simctl shutdown "$UDID" || true
          done < devices.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeze-hunt
          path: out
