name: Tests

on:
  push:
    # Android work doesn't need the Mac
    paths-ignore: ['android/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Tools
        run: brew install xcodegen ffmpeg

      - name: Test clips
        run: |
          mkdir -p testmedia
          ffmpeg -loglevel error -f lavfi -i "color=c=red:s=180x320:r=30:d=2" -f lavfi -i "sine=frequency=440:duration=2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testmedia/test-red.mp4
          ffmpeg -loglevel error -f lavfi -i "color=c=blue:s=180x320:r=30:d=2" -f lavfi -i "sine=frequency=660:duration=2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testmedia/test-blue.mp4
          # 4 s that beeps at 1.0 s and 3.0 s (sound timing around slowed clips)
          ffmpeg -loglevel error -f lavfi -i "color=c=gray:s=180x320:r=30:d=4" -f lavfi -i "sine=frequency=1000:duration=4" -af "volume='if(between(t,1,1.1)+between(t,3,3.1),0.8,0)':eval=frame" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testmedia/test-beeps.mp4
          # 8 gray steps and 4 color bars, tagged Rec. 709 like iPhone SDR video (ColorRoundTripTests)
          TAGS="setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709:range=tv"
          X264="colorprim=bt709:transfer=bt709:colormatrix=bt709"
          ffmpeg -loglevel error -f lavfi -i "color=c=black:s=180x320:r=30:d=2" -vf "format=yuv420p,geq=lum='16+floor(Y/40)*31':cb=128:cr=128,$TAGS" -c:v libx264 -crf 2 -pix_fmt yuv420p -x264-params "$X264" testmedia/test-ramp.mp4
          ffmpeg -loglevel error -f lavfi -i "color=c=black:s=180x320:r=30:d=2" -vf "format=gbrp,geq=r='if(lt(Y,80),200,if(lt(Y,160),40,if(lt(Y,240),60,220)))':g='if(lt(Y,80),40,if(lt(Y,160),180,if(lt(Y,240),70,170)))':b='if(lt(Y,80),30,if(lt(Y,160),60,if(lt(Y,240),200,140)))',scale=out_color_matrix=bt709:out_range=tv,format=yuv420p,$TAGS" -c:v libx264 -crf 2 -x264-params "$X264" testmedia/test-colors.mp4
          for f in test-ramp test-colors; do ffprobe -v error -show_entries stream=pix_fmt,color_range,color_space,color_transfer,color_primaries -of csv=p=0 testmedia/$f.mp4; done
          # old camera formats for the importer (LegacyImportTests)
          bash .github/scripts/make-legacy-media.sh testmedia

      - name: Restore voice model (Sidon v4, cached)
        uses: actions/cache@v4
        with:
          path: testmedia/sidon
          key: sidon-v4-eabb19247e46

      - name: Restore voice files and a spoken sentence
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo, rev = "seanll95/sidon-coreml", "eabb19247e46edfb785f6db36879d2ed5b2add54"
          tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/{rev}/v4?recursive=true"))
          for f in tree:
              if f["type"] != "file" or not f["path"].startswith("v4/sidon_"): continue
              dest = os.path.join("testmedia/sidon", f["path"])
              if os.path.exists(dest): continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              urllib.request.urlretrieve(f"https://huggingface.co/{repo}/resolve/{rev}/{f['path']}", dest)
          PY
          du -sh testmedia/sidon
          say -o testmedia/speech.aiff "This is a short test of the voice restoration model. The quick brown fox jumps over the lazy dog, and then it rests for a while in the warm afternoon sun."
          ffmpeg -loglevel error -y -i testmedia/speech.aiff -ar 48000 -ac 1 -c:a pcm_f32le testmedia/speech.wav

      - name: Run tests on the simulator
        run: |
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          FAILED=0
          TEST_RUNNER_BOMBOCUT_TEST_MEDIA="$PWD/testmedia" xcodebuild test -project Bombocut.xcodeproj -scheme Bombocut \
            -destination "id=$UDID" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || FAILED=1
          # results as annotations (readable through the API)
          RES=$(grep -E "Test Case .*(passed|failed|skipped)|error: |Executed [0-9]+ test" test.log | sed "s#$PWD/##" | sort -u | head -60 | awk '{printf "%s%%0A", $0}')
          [ -n "$RES" ] && echo "::notice title=Test results::$RES"
          grep -h "::notice title=Restore voice" test.log | head -3 || true
          if [ "$FAILED" = 1 ]; then
            echo "::error title=Tests failed::$(grep -E ': error|failed|Testing failed' test.log | sed "s#$PWD/##" | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
            tail -40 test.log
            exit 1
          fi
