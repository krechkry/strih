name: Inspect Sidon model

# Restore voice (Sidon, Core ML, seanll95/sidon-coreml v4): reads the model's inputs / outputs, checks the layout of
# sidon_fbank.bin against the upstream feature extractor (w2v-BERT 2.0), and prints reference features for a test
# signal the Swift tests rebuild exactly. Everything comes out as annotations (readable through the API).
on:
  push:
    paths: [".github/workflows/sidon-inspect.yml"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: pip install -q numpy coremltools "transformers>=4.40"

      - name: Download
        run: |
          python3 - <<'PY'
          import os, urllib.request
          repo = "seanll95/sidon-coreml"
          for p in ["v4/sidon_encoder_ane.mlpackage/Data/com.apple.CoreML/model.mlmodel",
                    "v4/sidon_decoder_ane.mlpackage/Data/com.apple.CoreML/model.mlmodel",
                    "v4/sidon_fbank.bin", "sidon_fbank.bin"]:
              dest = os.path.join("sidon", p)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              urllib.request.urlretrieve(f"https://huggingface.co/{repo}/resolve/main/{p}", dest)
          PY

      - name: Model inputs and outputs
        run: |
          python3 - <<'PY'
          from coremltools.proto import Model_pb2, FeatureTypes_pb2
          out = []
          for name in ["encoder", "decoder"]:
              m = Model_pb2.Model()
              m.ParseFromString(open(f"sidon/v4/sidon_{name}_ane.mlpackage/Data/com.apple.CoreML/model.mlmodel", "rb").read())
              out.append(f"{name}: {m.WhichOneof('Type')} spec {m.specificationVersion}")
              for kind, arr in (("in", m.description.input), ("out", m.description.output)):
                  for x in arr:
                      t = x.type
                      if t.WhichOneof("Type") == "multiArrayType":
                          a = t.multiArrayType
                          dt = FeatureTypes_pb2.ArrayFeatureType.ArrayDataType.Name(a.dataType)
                          out.append(f"  {kind} {x.name} {list(a.shape)} {dt} flex={a.WhichOneof('ShapeFlexibility')}")
                      else:
                          out.append(f"  {kind} {x.name} {t.WhichOneof('Type')}")
              out.append(f"  meta {dict(m.description.metadata.userDefined)}")
          text = "\n".join(out)
          print(text)
          print("::notice title=Model IO::" + text.replace("%", "%25").replace("\n", "%0A"))
          PY

      - name: Front end
        run: |
          python3 - <<'PY'
          import numpy as np
          from transformers import SeamlessM4TFeatureExtractor
          fe = SeamlessM4TFeatureExtractor.from_pretrained("facebook/w2v-bert-2.0")
          win = np.asarray(fe.window, dtype=np.float32)
          mel = np.asarray(fe.mel_filters, dtype=np.float32)
          rep = [f"window {win.shape} mel {mel.shape} stride {fe.stride} pad {fe.padding_value} sr {fe.sampling_rate} bins {fe.num_mel_bins}"]
          for fb in ["sidon/sidon_fbank.bin", "sidon/v4/sidon_fbank.bin"]:
              raw = np.fromfile(fb, dtype="<f4")
              rep.append(f"{fb}: {raw.size} floats")
              if raw.size == 400 + 257 * 80:
                  a_w, a_m = raw[:400], raw[400:]
                  b_m, b_w = raw[:257 * 80], raw[257 * 80:]
                  rep.append(f"  window first: win {np.abs(a_w - win).max():.3g} mel257x80 {np.abs(a_m.reshape(257, 80) - mel).max():.3g} mel80x257T {np.abs(a_m.reshape(80, 257).T - mel).max():.3g}")
                  rep.append(f"  window last: win {np.abs(b_w - win).max():.3g} mel257x80 {np.abs(b_m.reshape(257, 80) - mel).max():.3g} mel80x257T {np.abs(b_m.reshape(80, 257).T - mel).max():.3g}")
          rep.append(f"win[0:3] {win[:3].tolist()} win[200] {win[200]}")

          # reference features for a signal the Swift test makes the same way
          n = 48123
          t = np.arange(n, dtype=np.float64) / 16000.0
          state = 12345
          noise = np.empty(n)
          for i in range(n):
              state = (state * 1103515245 + 12345) % 2147483648
              noise[i] = state / 2147483648.0 * 2 - 1
          x = (0.3 * np.sin(2 * np.pi * 220 * t) + 0.2 * np.sin(2 * np.pi * (500 + 300 * t) * t) + 0.05 * noise).astype(np.float32)
          r = fe(x, sampling_rate=16000, return_tensors="np")
          f = r["input_features"][0]
          rep.append(f"features {f.shape} mask {r['attention_mask'][0].sum() if 'attention_mask' in r else '-'} sum {float(f.astype(np.float64).sum()):.6f} abs {float(np.abs(f.astype(np.float64)).sum()):.6f}")
          for (i, c) in [(0, 0), (0, 79), (0, 80), (0, 159), (10, 5), (75, 100), (148, 40), (149, 0), (149, 79), (149, 80), (149, 159)]:
              rep.append(f"f[{i},{c}] = {float(f[i, c]):.6f}")
          text = "\n".join(rep)
          print(text)
          print("::notice title=Front end::" + text.replace("%", "%25").replace("\n", "%0A"))
          PY
