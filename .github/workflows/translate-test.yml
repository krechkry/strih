name: Translation engine test

# Firefox's small translation models (one per language direction, via English) in bergamot-translator's WASM build:
# does it load them and how well do they translate captions?
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Engine
        run: |
          cd tools/bergamot
          npm init -y >/dev/null
          npm install @browsermt/bergamot-translator@0.4.9 >/dev/null
          # the package is an ES module; the worker runs as CommonJS under node
          mkdir -p engine && cp node_modules/@browsermt/bergamot-translator/worker/* engine/
          mv engine/translator-worker.js engine/translator-worker.cjs
      - name: Models
        run: python3 tools/bergamot/fetch.py models csen encs sken ensk 2>&1 | tee fetch.txt
      - name: Translate
        run: node tools/bergamot/test.js models 2>&1 | tee out.txt
      - name: Publish results (translate-test branch)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/r"; cp fetch.txt out.txt "$RUNNER_TEMP/r/" 2>/dev/null || true
          git config user.name "bombocut-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan translate-test
          git rm -rfq . ; git clean -fdxq
          cp "$RUNNER_TEMP"/r/* . ; git add -A; git commit -qm "Translation test of $GITHUB_SHA"
          git push -fq origin translate-test
