name: Android

on:
  push:
    paths: ['android/**', 'shared/**', 'Bombocut/Localizable.xcstrings', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# a newer push makes an older run pointless
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Newest versions on Google's Maven and Maven Central (to bump libs.versions.toml)
        continue-on-error: true
        run: |
          latest() { curl -s "$1" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -v -i -E 'alpha|beta|rc|dev|-M|eap' | tail -3 | tr '\n' ' '; }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          {
            echo "### Newest stable versions"
            echo "- AGP: $(latest $G/com/android/tools/build/gradle/maven-metadata.xml)"
            echo "- Compose BOM: $(latest $G/androidx/compose/compose-bom/maven-metadata.xml)"
            echo "- Media3: $(latest $G/androidx/media3/media3-exoplayer/maven-metadata.xml)"
            echo "- Activity: $(latest $G/androidx/activity/activity-compose/maven-metadata.xml)"
            echo "- Lifecycle: $(latest $G/androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml)"
            echo "- Kotlin: $(latest $C/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml)"
            echo "- kotlinx.serialization: $(latest $C/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml)"
            echo "- Gradle: $(curl -s https://services.gradle.org/versions/current | grep -o '"version" *: *"[^"]*"' | head -1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK and run the unit tests
        working-directory: android
        run: gradle --no-daemon assembleDebug testDebugUnitTest --stacktrace

      - name: Test results
        if: always()
        run: |
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -h -A5 '<failure' android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -80 || true
          [ -f android/app/build/color-report.txt ] && { echo "### Adjust colors vs iPhone"; cat android/app/build/color-report.txt; } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bombocut-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Test clips
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq --fix-missing ffmpeg > /dev/null
          mkdir -p android/ci/media
          ffmpeg -loglevel error -f lavfi -i "testsrc2=s=360x640:r=30:d=3" -f lavfi -i "sine=frequency=440:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/ci/media/red.mp4
          ffmpeg -loglevel error -f lavfi -i "color=c=green:s=360x640:r=30:d=3,drawtext=text='L %{pts}':fontsize=60:fontcolor=white:x=40:y=300" -f lavfi -i "sine=frequency=880:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/ci/media/green.mp4 || \
            ffmpeg -loglevel error -f lavfi -i "color=c=green:s=360x640:r=30:d=3" -f lavfi -i "sine=frequency=880:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/ci/media/green.mp4
          ffmpeg -loglevel error -f lavfi -i "color=c=blue:s=360x640:r=30:d=3,drawtext=text='%{pts}':fontsize=60:fontcolor=white:x=40:y=300" -f lavfi -i "sine=frequency=660:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/ci/media/blue.mp4 || \
            ffmpeg -loglevel error -f lavfi -i "color=c=blue:s=360x640:r=30:d=3" -f lavfi -i "sine=frequency=660:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/ci/media/blue.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screens on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/emulator-run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android/ci/out/

      - name: Screens to the android-screens branch (readable with git)
        if: always()
        run: |
          [ -d android/ci/out ] || exit 0
          SHA=$(git rev-parse --short HEAD)
          cp -r android/ci/out /tmp/screens
          # committed from a folder that holds only these files (never the build outputs: the APK is over 100 MB)
          cd /tmp/screens
          git init -q -b out
          git config user.name screens-bot; git config user.email screens-bot@users.noreply.github.com
          echo "$SHA" > COMMIT
          git add -A
          git commit -qm "screens from $SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:android-screens

