name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Strih.xcodeproj -target Strih -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Strih.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Strih.app Payload/
          zip -qry Strih.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Strih-ipa
          path: Strih.ipa
          retention-days: 30
