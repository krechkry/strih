name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
          FAILED=0
          xcodebuild -project Strih.xcodeproj -target Strih -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || FAILED=1
          # Errors become one annotation (readable through the API, raw logs are not)
          ERR=$(grep -E ": error:" build.log | sed "s#$PWD/##" | sort -u | head -60 | awk '{printf "%s%%0A", $0}')
          [ -n "$ERR" ] && echo "::error title=Compile errors::$ERR"
          WARN=$(grep -E ": warning:" build.log | grep -v "/build/" | sed "s#$PWD/##" | sort -u | head -40 | awk '{printf "%s%%0A", $0}')
          [ -n "$WARN" ] && echo "::warning title=Warnings::$WARN"
          tail -3 build.log
          if [ "$FAILED" = 1 ] || [ ! -f build/Release-iphoneos/Strih.app/Strih ]; then
            [ -z "$ERR" ] && echo "::error title=Build failed::$(tail -30 build.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Strih.app Payload/
          zip -qry Strih.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: Strih-ipa
          path: Strih.ipa
          retention-days: 30
