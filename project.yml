name: Bombocut
options:
  bundleIdPrefix: cz.krechler
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 61d41b3ca04833d1cb80632c82ba401f117a01ef
fileGroups:
  - Bombocut.storekit
targets:
  Bombocut:
    type: application
    platform: iOS
    sources: [Bombocut]
    scheme:
      storeKitConfiguration: Bombocut.storekit
      testTargets: [BombocutTests]
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    postBuildScripts:
      - name: Build number from the date (Release / Archive)
        basedOnDependencyAnalysis: false
        script: |
          # Every archive gets a new, increasing build number (yymmddHHMM, UTC), so uploads to
          # TestFlight never clash. Debug runs from Xcode keep "1".
          if [ "$CONFIGURATION" = "Release" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date -u +%y%m%d%H%M)" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.krechler.bombocut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BOMBOCUT"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "BOMBOCUT saves exported videos to your library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BOMBOCUT imports videos you pick to edit them."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BombocutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bombocut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.krechler.bombocut.tests
        CODE_SIGN_STYLE: Automatic
