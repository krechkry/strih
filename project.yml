name: Bombocut
options:
  bundleIdPrefix: cz.krechler
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 61d41b3ca04833d1cb80632c82ba401f117a01ef
  # .bombocut project files are plain zips (Model/ProjectFile.swift)
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
fileGroups:
  - Bombocut.storekit
targets:
  Bombocut:
    type: application
    platform: iOS
    sources:
      - Bombocut
      # the speech cleanup model (DeepFilterNet3, Core ML), copied into the app as a folder
      - path: Models/DeepFilterNet3
        type: folder
        buildPhase: resources
    scheme:
      storeKitConfiguration: Bombocut.storekit
      testTargets: [BombocutTests]
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: ZIPFoundation
    # iCloud: presets and settings sync (key-value store) and project backups (iCloud Drive, "BOMBOCUT")
    entitlements:
      path: Config/Bombocut.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.cz.krechler.bombocut]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.cz.krechler.bombocut]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      configs:
        # runs from Xcode are optimized too: stabilization analysis and speech cleanup do heavy math
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.krechler.bombocut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BOMBOCUT"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "BOMBOCUT saves exported videos to your library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "BOMBOCUT imports videos you pick to edit them."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # one window only (Config/Info.plist): two editors on the same projects would overwrite each other
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # iPad: every orientation (iPad windows can be any shape); the layout is made for portrait first
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPhone and iPad (shipped from the build after 1.0's; once on the App Store, iPad can't be taken back)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BombocutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bombocut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.krechler.bombocut.tests
        CODE_SIGN_STYLE: Automatic
